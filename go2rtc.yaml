api:
  listen: ":1984"
  origin: "*"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

# Define your camera streams here.
# This file can be overridden at runtime by mounting a custom go2rtc.yaml:
#   -v /path/to/your/go2rtc.yaml:/config/go2rtc.yaml
streams:
  # Example — replace with your real camera RTSP URLs:
  # camera-1: rtsp://username:password@192.168.1.100:554/stream1
  # camera-2: rtsp://username:password@192.168.1.101:554/stream1
